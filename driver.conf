# amix-kerntools driver descriptor for the Amiga 4000 onboard Gayle IDE controller.
#
# Format: <product-number>  <queue-func>  "<hardware name>"  <source under src/>  [probe=<fn>]
#
# Gayle IDE is a fixed-address device (0xDD2020), not an AutoConfig board, so it
# never appears in the bootinfo autocon table.  The product number below is a
# synthetic tag that cannot match any real Zorro board; registration happens
# solely through the probe fallback that sd.c's init() calls when the table has
# no entry: idepresent() gates on the AGA chipset, verifies the controller by a
# register write/readback and hands back the base address.
0xFFFF1DE0  idequeue  "A4000 IDE"  ide.c  probe=idepresent
